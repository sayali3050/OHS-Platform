services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ohs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ohs}
      POSTGRES_DB: ${POSTGRES_DB:-ohs}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ohs}"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ohs}:${POSTGRES_PASSWORD:-ohs}@db:5432/${POSTGRES_DB:-ohs}
    volumes: [uploads:/app/uploads]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  web:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
  uploads:
