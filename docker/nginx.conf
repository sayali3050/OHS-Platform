server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 45m;  # 3 photos x 10 MB + an 8 MB voice note + form fields; the API enforces the real limits

  # Security headers on every response. Set here at server level only: nginx drops inherited add_header lines in any
  # location that declares its own, so the locations below use `expires` for caching instead of add_header.
  # The script hash allows exactly the inline theme script in index.html (a test checks it still matches).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2bpwV4dnOn2ZnDR7jXpRNsUwkr36ORv/3tdiK4bEqdM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Microphone and camera for voice notes and photos; nothing else.
  add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(), payment=(), usb=()" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }
  # SPA: let React Router handle unknown paths. The page itself is never cached, so a rebuild shows up on the next
  # load; hashed assets never change, so they're cached for a year.
  location / { try_files $uri /index.html; expires epoch; }
  location /assets/ { expires max; }
}
