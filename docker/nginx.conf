server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 45m;  # 3 photos x 10 MB + an 8 MB voice note + form fields; the API enforces the real limits

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # SPA: let React Router handle unknown paths.
  # The page itself is never cached, so a rebuild shows up on the next load; hashed assets are cached for a year.
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
